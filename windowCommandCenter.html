<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Multiple Windows</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
            background-color: #f0f0f0;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            margin: 5px;
        }
        button#closeBtn {
            background-color: #dc3545;
        }
        button:hover {
            background-color: #0056b3;
        }
        button#closeBtn:hover {
            background-color: #c82333;
        }
        p {
            margin-top: 20px;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Click to Open Windows</h1>
    <p>This will attempt to open N new windows, which your browser will likely block.</p>
    <p>Use the buttons below to open and close them.</p>
    
    <button onclick="openWindows()">Start</button>
    <button id="closeBtn" onclick="closeAllWindows()">Close All</button>

    <script>
        // Array to store references to the opened windows
        let openedWindows = [];

        function openWindows() {
            const url = 'http://127.0.0.1:5500/iframeTest.html';
            const numWindows = 2;
            const delay = 100; // Delay in milliseconds

            // Define grid dimensions (for display purposes, positioning won't work)
            const numCols = 5;
            const numRows = Math.ceil(numWindows / numCols);

            // Define window dimensions (browser will respect this)
            const windowWidth = 1000;
            const windowHeight = 600;

            for (let i = 0; i < numWindows; i++) {
                // Calculate position for the theoretical grid
                const row = Math.floor(i / numCols);
                const col = i % numCols;

                const topPos = row * (windowHeight + 150); 
                const leftPos = col * (windowWidth + 150);

                const windowFeatures = `menubar=no,location=no,resizable=yes,scrollbars=yes,status=yes,width=${windowWidth},height=${windowHeight},top=${topPos},left=${leftPos}`;

                setTimeout(() => {
                    const newWindow = window.open(url, '_blank', windowFeatures);
                    // Store the reference if the window was successfully opened
                    if (newWindow) {
                            
                        newWindow.moveTo(leftPos, topPos);
                        openedWindows.push(newWindow);

                    }
                }, i * delay);
            }
        }

        function closeAllWindows() {

            console.log("Closing")
            // Loop through the stored window references and close them
            for (let i = 0; i < openedWindows.length; i++) {
                if (openedWindows[i] && !openedWindows[i].closed) {
                    openedWindows[i].close();
                }
            }
            // Clear the array
            console.log(openedWindows)
            openedWindows = [];
        }
    </script>

</body>
</html>
